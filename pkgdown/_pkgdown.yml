url: https://andrewallenbruce.github.io/procedural/

deploy:
  install_metadata: true

template:
  bootstrap: 5
  theme: tango
  bslib:
    font_scale: 1.6
    line_height: 2
    base_font: {google: "Inter"}
    heading_font: {google: "Fraunces"}
    code_font: "Hack, mono"
  includes:
    in_header: <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/hack-font@3/build/web/hack-subset.css">

home:
  title: procedural • Tidy ICD-10-PCS Tools
  description: >
    Tidy tools for working with ICD-10-PCS procedure codes.
  sidebar:
    structure: [links, license, community, citation, authors, dev]

navbar:
  structure:
    left:
    - reference
    - articles
    right:
    - home
    - news
    - github
    - twitter
    - linkedin
    - lightswitch
  components:
    search:
      search: []
    lightswitch:
      icon: fa-sun
      aria-label: Light switch
      id: lightswitch
      menu:
      - text: Light
        theme: light
        icon: fa-sun
      - text: Dark
        theme: dark
        icon: fa-moon
      - text: Auto
        theme: auto
        icon: fa-adjust
    home:
      icon: fas fa-home fa-lg
      text: ""
      href: index.html
    reference:
      text: Reference
      href: reference/index.html
    news:
      icon: far fa-newspaper fa-lg
      href: news/index.html
      text: ""
      title: "Changelog"
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/andrewallenbruce/procedural
    linkedin:
      icon: fas fa-linkedin fa-lg
      href: https://www.linkedin.com/in/andrewallenbruce
    twitter:
      icon: fab fa-twitter fa-lg
      href: https://twitter.com/andrewallbruce

reference:

- title: PCS Machinery
  desc: >
    ICD-10-PCS Building Blocks.
  contents:
  - table
  - definitions
  - index
  - order
